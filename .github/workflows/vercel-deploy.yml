name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Production deployment
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull production Vercel settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  configuration-required:
    name: Vercel credentials required
    if: ${{ secrets.VERCEL_TOKEN == '' || secrets.VERCEL_ORG_ID == '' || secrets.VERCEL_PROJECT_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required repository secrets
        run: |
          echo "::notice title=Vercel deployment not started::Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under GitHub Settings > Secrets and variables > Actions. Then rerun this workflow."
          echo "Deployment skipped: VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be configured as GitHub Actions secrets."
