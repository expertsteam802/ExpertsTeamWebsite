name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check required Vercel credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$VERCEL_TOKEN" ]] || missing+=("VERCEL_TOKEN")
          [[ -n "$VERCEL_ORG_ID" ]] || missing+=("VERCEL_ORG_ID")
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing+=("VERCEL_PROJECT_ID")
          if (( ${#missing[@]} )); then
            echo "::error title=Vercel credentials missing::Add these GitHub Actions repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull production Vercel settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
