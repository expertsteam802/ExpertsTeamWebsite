name: CI

on:
  push:
    branches: [main, work/production-hardening-2026-11]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format source files
        run: npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css}" "package.json" "docs/**/*.md" ".github/workflows/*.yml"
      - name: Run tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Commit synchronized lockfile
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: format source and synchronize npm lockfile"
            git push
          fi
