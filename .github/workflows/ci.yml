name: CI

on:
  push:
    branches: [main, work/production-hardening-2026-11]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}" "package.json" "docs/**/*.md" ".github/workflows/*.yml"
      - name: Run tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Build production app
        run: npm run build
