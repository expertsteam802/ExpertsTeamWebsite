<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ExpertsTeam ET monogram</title>
  <desc id="desc">A compact electric-blue ET lettermark centered inside a circular dark background.</desc>
  <defs>
    <linearGradient id="letters" x1="120" y1="150" x2="390" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".48" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="matrix(0 360 -360 0 256 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142B52"/>
      <stop offset="1" stop-color="#050B18"/>
    </radialGradient>
    <filter id="softGlow" x="15%" y="15%" width="70%" height="70%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#background)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#60A5FA" stroke-opacity=".22" stroke-width="2"/>
  <path d="M256 90a166 166 0 1 0 0 332a166 166 0 0 0 0-332Z" fill="#0B1830" fill-opacity=".55"/>
  <text x="256" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="172" font-weight="800" letter-spacing="-18" fill="url(#letters)" filter="url(#softGlow)">ET</text>
  <path d="M172 352h168" stroke="#38BDF8" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
</svg>