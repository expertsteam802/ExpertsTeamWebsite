<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">ExpertsTeam — Make the Uncommon</title><desc id="desc">The ExpertsTeam ET emblem in electric cyan and gold, with the ExpertsTeam wordmark and Make the Uncommon tagline.</desc>
<defs>
