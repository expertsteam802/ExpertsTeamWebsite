<text x="600" y="555" text-anchor="middle" fill="url(#silver)" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="5">EXPERTSTEAM</text>
<text x="600" y="600" text-anchor="middle" fill="#b7d7f5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" letter-spacing="8">MAKE THE UNCOMMON</text>
