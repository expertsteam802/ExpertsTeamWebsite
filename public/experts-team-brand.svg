<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">ExpertsTeam — Building Technology. Creating Intelligence.</title>
  <desc id="desc">The ExpertsTeam ET monogram in electric blue and gold, with the ExpertsTeam wordmark.</desc>
  <defs>
    <linearGradient id="ring" x1="340" y1="40" x2="860" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28D9FF"/><stop offset=".52" stop-color="#347BFF"/><stop offset="1" stop-color="#FFC247"/>
    </linearGradient>
    <linearGradient id="blue" x1="430" y1="100" x2="610" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74F2FF"/><stop offset=".5" stop-color="#16B9F4"/><stop offset="1" stop-color="#3974FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="590" y1="100" x2="760" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0A6"/><stop offset=".5" stop-color="#FFC247"/><stop offset="1" stop-color="#E58A18"/>
    </linearGradient>
    <linearGradient id="word" x1="300" y1="0" x2="900" y2="0">
      <stop stop-color="#FFFFFF"/><stop offset=".65" stop-color="#BBDFFF"/><stop offset="1" stop-color="#FFC247"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="670" rx="44" fill="#061426"/>
  <circle cx="600" cy="244" r="202" fill="#07192D" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="600" cy="244" r="184" fill="none" stroke="#B9E9FF" stroke-opacity=".13" stroke-width="2"/>
  <path d="M447 125h190v52H506v47h118v50H506v48h131v52H447z" fill="url(#blue)" filter="url(#glow)"/>
  <path d="M619 125h138v52h-43v197h-56V177h-39z" fill="url(#gold)" filter="url(#glow)"/>
  <text x="600" y="545" text-anchor="middle" fill="url(#word)" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="3">EXPERTSTEAM</text>
  <text x="600" y="594" text-anchor="middle" fill="#A9C9E9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" letter-spacing="5">BUILDING TECHNOLOGY · CREATING INTELLIGENCE</text>
</svg>