 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13f5ff"/><stop offset=".55" stop-color="#00b8e8"/><stop offset="1" stop-color="#0875c7"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff09a"/><stop offset=".48" stop-color="#ffc52e"/><stop offset="1" stop-color="#d98508"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#aab9cc"/></linearGradient>
 <filter id="glowC" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
